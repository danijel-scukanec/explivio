# Manual, push-button deploy to Azure Container Apps via azd.
#
# This is deliberately NOT triggered on push: the stack costs money while it is up, so you deploy on
# demand (Actions tab -> "Deploy to Azure (manual)" -> Run workflow -> type "deploy"), and tear it down
# with `azd down --purge` when you are done. CI (build + test) still runs automatically on every PR;
# only the deploy is manual.
#
# ── One-time setup (see .github/workflows/README-deploy.md) ──────────────────────────────────────────
# Easiest: run `azd pipeline config --provider github` once — it creates the Azure OIDC app + federated
# credential and sets AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID. Then DELETE the
# azure-dev.yml it generates (that one is push-triggered) and keep this file. Finally add the app-config
# values below. Everything is a repo VARIABLE (not a secret): OIDC needs no password, and the app uses
# its managed identity for Azure OpenAI, so there is no API key to protect.
#
#   Repo VARIABLES (Settings > Secrets and variables > Actions > Variables):
#     AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  (set by `azd pipeline config`)
#     AZURE_ENV_NAME (e.g. explivio), AZURE_LOCATION (e.g. swedencentral)
#     AI_ENDPOINT, AI_MODEL, AI_EMBEDDING_ENDPOINT, AI_EMBEDDING_MODEL, AI_OPENAI_RESOURCE_ID,
#     ENTRA_AUTHORITY, ENTRA_AUDIENCE          (API bearer-token validation)
#     ALLOWED_EMAILS (comma-separated sign-in allowlist; empty = allow everyone. Set this to lock the
#       showcase to your own account so self-registered strangers can't use resources, notably paid AI.)
#     VITE_ENTRA_AUTHORITY, VITE_ENTRA_CLIENT_ID, VITE_ENTRA_API_SCOPE
#       (web SPA sign-in, baked into the build by the prepackage hook; public identifiers, not secrets.
#        Without these the deployed SPA has no sign-in and sends no token, so the prod API 401s every
#        data call. The SPA's deployed origin must also be a redirect URI on its Entra app registration.)
#     VITE_GOOGLE_PLACES_KEY (optional; web place autocomplete + geocoding so the trip map populates.
#       Public browser key — restrict it to the deployed origin in the Google Cloud console. Without it
#       the app works but has no place search and the itinerary map stays empty.)

name: Deploy to Azure (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm provisioning + deploying to Azure (this costs money).'
        required: true
        default: ''

permissions:
  id-token: write   # request the OIDC token used to log in to Azure (no stored Azure password)
  contents: read

jobs:
  deploy:
    # Guard: only run when the operator explicitly typed "deploy".
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    env:
      # azd pipeline config stores these as repo VARIABLES (OIDC needs no secret); the app config
      # (AI/Entra) is non-sensitive too (managed identity, not a key), so everything is a variable.
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      # Web SPA Entra sign-in config, read by the azure.yaml prepackage hook's `npm run build -w frontend`
      # (Vite inlines VITE_*-prefixed env vars). Public identifiers, so plain repo variables.
      VITE_ENTRA_AUTHORITY: ${{ vars.VITE_ENTRA_AUTHORITY }}
      VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
      VITE_ENTRA_API_SCOPE: ${{ vars.VITE_ENTRA_API_SCOPE }}
      # Google Places (New) browser key for place autocomplete + geocoding (so the trip map populates).
      # Public but referrer-restricted — restrict it to the deployed origin in the Google Cloud console.
      VITE_GOOGLE_PLACES_KEY: ${{ vars.VITE_GOOGLE_PLACES_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in to Azure (OIDC federated credential)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      # The postdeploy hook (in azure.yaml) shells out to the `az` CLI, which has its OWN session
      # separate from azd's. Without this, the hook fails with "Please run 'az login'".
      - name: Log in to Azure CLI (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Seed azd environment (config comes from repo variables, not the repo)
        run: |
          azd env new "$AZURE_ENV_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" || azd env select "$AZURE_ENV_NAME"
          azd env set AI_ENDPOINT            "${{ vars.AI_ENDPOINT }}"
          azd env set AI_MODEL               "${{ vars.AI_MODEL }}"
          azd env set AI_EMBEDDING_ENDPOINT  "${{ vars.AI_EMBEDDING_ENDPOINT }}"
          azd env set AI_EMBEDDING_MODEL     "${{ vars.AI_EMBEDDING_MODEL }}"
          azd env set AI_OPENAI_RESOURCE_ID  "${{ vars.AI_OPENAI_RESOURCE_ID }}"
          azd env set ENTRA_AUTHORITY        "${{ vars.ENTRA_AUTHORITY }}"
          azd env set ENTRA_AUDIENCE         "${{ vars.ENTRA_AUDIENCE }}"
          azd env set ALLOWED_EMAILS         "${{ vars.ALLOWED_EMAILS }}"

      - name: Provision + deploy (azd up)
        run: azd up --no-prompt

      - name: Show the app URL
        run: azd show --output json | python3 -c "import sys,json; d=json.load(sys.stdin); [print(s.get('endpoint','')) for s in d.get('services',{}).values()] if isinstance(d.get('services'),dict) else None" || true
