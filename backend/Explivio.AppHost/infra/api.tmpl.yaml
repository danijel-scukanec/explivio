api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      external: true
      targetPort: {{ targetPortOrDefault 8080 }}
      transport: http
      allowInsecure: true
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
    secrets:
      - name: applicationinsights-connection-string
        value: '{{ .Env.APPINSIGHTS_APPINSIGHTSCONNECTIONSTRING }}'
      - name: cosmos-uri
        value: '{{ .Env.COSMOS_CONNECTIONSTRING }}'
      - name: connectionstrings--blobs
        value: '{{ .Env.STORAGE_BLOBENDPOINT }}'
      - name: connectionstrings--cosmos
        value: '{{ .Env.COSMOS_CONNECTIONSTRING }}'
      - name: connectionstrings--messaging
        value: '{{ .Env.MESSAGING_SERVICEBUSENDPOINT }}'
      - name: connectionstrings--sqlserver
        value: Server=tcp:{{ .Env.SQL_SQLSERVERFQDN }},1433;Encrypt=True;Authentication="Active Directory Default";Database=Explivio
      - name: connectionstrings--signalr
        value: 'Endpoint=https://{{ .Env.SIGNALR_HOSTNAME }};AuthType=azure.msi;ClientId={{ .Env.MANAGED_IDENTITY_CLIENT_ID }};Version=1.0;'
  template:
    containers:
      - image: {{ .Image }}
        name: api
        env:
          - name: AZURE_CLIENT_ID
            value: {{ .Env.MANAGED_IDENTITY_CLIENT_ID }}
          - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
            value: "true"
          - name: BLOBS_URI
            value: '{{ .Env.STORAGE_BLOBENDPOINT }}'
          - name: HTTP_PORTS
            value: '{{ targetPortOrDefault 0 }}'
          - name: MESSAGING_HOST
            value: '{{ .Env.MESSAGING_SERVICEBUSHOSTNAME }}'
          - name: MESSAGING_URI
            value: '{{ .Env.MESSAGING_SERVICEBUSENDPOINT }}'
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY
            value: in_memory
          - name: SQLSERVER_DATABASENAME
            value: Explivio
          - name: SQLSERVER_HOST
            value: '{{ .Env.SQL_SQLSERVERFQDN }}'
          - name: SQLSERVER_JDBCCONNECTIONSTRING
            value: jdbc:sqlserver://{{ .Env.SQL_SQLSERVERFQDN }}:1433;database=Explivio;encrypt=true;trustServerCertificate=false
          - name: SQLSERVER_PORT
            value: "1433"
          - name: SQLSERVER_URI
            value: mssql://{{ .Env.SQL_SQLSERVERFQDN }}:1433/Explivio
          - name: APPLICATIONINSIGHTS_CONNECTION_STRING
            secretRef: applicationinsights-connection-string
          - name: COSMOS_URI
            secretRef: cosmos-uri
          - name: ConnectionStrings__blobs
            secretRef: connectionstrings--blobs
          - name: ConnectionStrings__cosmos
            secretRef: connectionstrings--cosmos
          - name: ConnectionStrings__messaging
            secretRef: connectionstrings--messaging
          - name: ConnectionStrings__sqlserver
            secretRef: connectionstrings--sqlserver
          - name: ConnectionStrings__signalr
            secretRef: connectionstrings--signalr
    scale:
      minReplicas: 1
tags:
  azd-service-name: api
  aspire-resource-name: api
