# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# azd configuration for deploying Explivio to Azure Container Apps.
#
# The single service points at the .NET Aspire AppHost. azd reads the Aspire
# deployment manifest the AppHost emits and generates the Container Apps
# infrastructure itself (one Container App per project resource, plus Azure SQL,
# Service Bus and Application Insights) — there is no hand-written Bicep to
# maintain. Run `azd infra synth` if you want that generated Bicep written into
# the repo to inspect or customise.
name: explivio
services:
  app:
    language: dotnet
    project: ./backend/Explivio.AppHost/Explivio.AppHost.csproj
    host: containerapp

# Before azd packages the container images, build the React web app (with a RELATIVE api base, so it
# calls the same origin) into the API's wwwroot. The API then serves the SPA — the deployed app is a
# single Container App + URL with no CORS and no API-URL to reconfigure per spin-up. Runs on the machine
# running `azd` (which has Node); never affects local `aspire run`.
hooks:
  prepackage:
    posix:
      shell: sh
      continueOnError: false
      run: |
        set -e
        npm --prefix client ci
        npm --prefix client run build -w @explivio/shared
        VITE_API_URL= npm --prefix client run build -w frontend
        rm -rf backend/Explivio.API/wwwroot
        mkdir -p backend/Explivio.API/wwwroot
        cp -r client/frontend/dist/. backend/Explivio.API/wwwroot/
    windows:
      shell: pwsh
      continueOnError: false
      run: |
        npm --prefix client ci
        npm --prefix client run build -w "@explivio/shared"
        $env:VITE_API_URL=""; npm --prefix client run build -w frontend
        Remove-Item -Recurse -Force backend/Explivio.API/wwwroot -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force backend/Explivio.API/wwwroot | Out-Null
        Copy-Item -Recurse client/frontend/dist/* backend/Explivio.API/wwwroot/
